[package]
name = "filesystem-usage-exporter"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio-cron-scheduler = "0.15.1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
chrono-tz = "0.10"
